<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img">
  <defs>
    <radialGradient id="g5-vig" cx="50%" cy="46%" r="78%">
      <stop offset="0%" stop-color="#f7ecd7"/>
      <stop offset="76%" stop-color="#f7ecd7"/>
      <stop offset="100%" stop-color="#e8d7b8"/>
    </radialGradient>
    <g id="g5-corner">
      <!-- sidomukti corner ornament: diamonds + prosperity dots -->
      <path d="M0,64 L64,0" fill="none" stroke="#b49158" stroke-width="1.5"/>
      <path d="M0,80 L80,0" fill="none" stroke="#8c6b35" stroke-width="0.75"/>
      <path d="M34,34 L48,48 L34,62 L20,48 Z" fill="none" stroke="#b49158" stroke-width="1.5"/>
      <path d="M34,42 L40,48 L34,54 L28,48 Z" fill="#b49158"/>
      <circle cx="14" cy="14" r="3" fill="#6b4423"/>
      <circle cx="62" cy="62" r="2" fill="#8c6b35"/>
    </g>
  </defs>

  <rect width="600" height="600" fill="url(#g5-vig)"/>

  <!-- gold hairline frame -->
  <rect x="12" y="12" width="576" height="576" fill="none" stroke="#b49158" stroke-width="1.5"/>
  <rect x="22" y="22" width="556" height="556" fill="none" stroke="#8c6b35" stroke-width="0.75" stroke-opacity="0.7"/>

  <!-- corner ornaments -->
  <use href="#g5-corner" transform="translate(52,52)"/>
  <use href="#g5-corner" transform="translate(548,52) scale(-1,1)"/>
  <use href="#g5-corner" transform="translate(52,548) scale(1,-1)"/>
  <use href="#g5-corner" transform="translate(548,548) scale(-1,-1)"/>

  <!-- faint sidomukti diamond grid behind the date -->
  <g fill="none" stroke="#8c6b35" stroke-width="0.75" stroke-opacity="0.28">
    <path d="M300,150 L390,300 L300,450 L210,300 Z"/>
    <path d="M300,190 L356,300 L300,410 L244,300 Z" stroke-opacity="0.18"/>
    <circle cx="300" cy="150" r="2.5" fill="#b49158" fill-opacity="0.5" stroke="none"/>
    <circle cx="300" cy="450" r="2.5" fill="#b49158" fill-opacity="0.5" stroke="none"/>
    <circle cx="210" cy="300" r="2.5" fill="#b49158" fill-opacity="0.5" stroke="none"/>
    <circle cx="390" cy="300" r="2.5" fill="#b49158" fill-opacity="0.5" stroke="none"/>
  </g>

  <!-- date emblem -->
  <g font-family="Palatino Linotype, Palatino, Georgia, serif" fill="#4a1520" text-anchor="middle">
    <text x="300" y="352" font-size="52" letter-spacing="6">06 . 02 . 2028</text>
  </g>
  <!-- rule ornaments -->
  <g stroke="#b49158" stroke-width="1.25">
    <line x1="120" y1="240" x2="268" y2="240"/>
    <line x1="332" y1="240" x2="480" y2="240"/>
    <line x1="120" y1="380" x2="268" y2="380"/>
    <line x1="332" y1="380" x2="480" y2="380"/>
  </g>
  <g fill="#b49158">
    <path d="M300,232 L310,240 L300,248 L290,240 Z"/>
    <path d="M300,372 L310,380 L300,388 L290,380 Z"/>
    <circle cx="120" cy="240" r="2.5"/>
    <circle cx="480" cy="240" r="2.5"/>
    <circle cx="120" cy="380" r="2.5"/>
    <circle cx="480" cy="380" r="2.5"/>
  </g>
</svg>
