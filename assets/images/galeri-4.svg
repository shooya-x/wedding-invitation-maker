      <rect x="-80" y="286" width="760" height="52" fill="#6b4423" fill-opacity="0.55"/>
      <rect x="-80" y="286" width="760" height="2" fill="#b49158" fill-opacity="0.55"/>
      <rect x="-80" y="338" width="760" height="2" fill="#b49158" fill-opacity="0.35"/>
      <rect x="-80" y="502" width="760" height="34" fill="#b49158" fill-opacity="0.14"/>
      <rect x="-80" y="502" width="760" height="1.5" fill="#b49158" fill-opacity="0.4"/>
