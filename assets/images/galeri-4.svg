    <path d="M300,185 L415,300 L300,415 L185,300 Z" fill="#380f18" stroke="#b49158" stroke-width="2.5"/>
    <path d="M300,210 L390,300 L300,390 L210,300 Z" fill="none" stroke="#8c6b35" stroke-width="1"/>
    <path d="M300,240 L360,300 L300,360 L240,300 Z" fill="none" stroke="#b49158" stroke-width="0.75" stroke-dasharray="3 5"/>
    <circle cx="300" cy="300" r="6" fill="#b49158"/>
    <circle cx="300" cy="300" r="118" fill="none" stroke="#8c6b35" stroke-width="0.75" stroke-opacity="0.5"/>
