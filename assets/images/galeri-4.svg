      <rect x="-80" y="152" width="760" height="1.5" fill="#b49158" fill-opacity="0.3"/>
      <!-- parang teeth zigzags -->
      <path d="M-80,-240 L-56,-254 L-32,-240 L-8,-254 L16,-240 L40,-254 L64,-240 L88,-254 L112,-240 L136,-254 L160,-240 L184,-254 L208,-240 L232,-254 L256,-240 L280,-254 L304,-240 L328,-254 L352,-240 L376,-254 L400,-240 L424,-254 L448,-240 L472,-254 L496,-240 L520,-254 L544,-240 L568,-254 L592,-240 L616,-254 L640,-240 L664,-254 L680,-245" fill="none" stroke="#b49158" stroke-width="1.5" stroke-opacity="0.5"/>
      <path d="M-80,376 L-56,362 L-32,376 L-8,362 L16,376 L40,362 L64,376 L88,362 L112,376 L136,362 L160,376 L184,362 L208,376 L232,362 L256,376 L280,362 L304,376 L328,362 L352,376 L376,362 L400,376 L424,362 L448,376 L472,362 L496,376 L520,362 L544,376 L568,362 L592,376 L616,362 L640,376 L680,371" fill="none" stroke="#b49158" stroke-width="1.5" stroke-opacity="0.5"/>
