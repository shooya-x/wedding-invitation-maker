<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="120" viewBox="0 0 1200 120">
  <defs>
    <linearGradient id="cloud-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B49158" stop-opacity="0"/>
      <stop offset="10%" stop-color="#B49158" stop-opacity="1"/>
      <stop offset="90%" stop-color="#B49158" stop-opacity="1"/>
      <stop offset="100%" stop-color="#B49158" stop-opacity="0"/>
    </linearGradient>
    <pattern id="mega-divider-pattern" width="120" height="120" patternUnits="userSpaceOnUse">
      <!-- Cloud layers across the divider -->
      <g fill="url(#cloud-gradient)">
        <ellipse cx="20" cy="70" rx="35" ry="25"/>
        <ellipse cx="75" cy="55" rx="40" ry="28"/>
        <ellipse cx="130" cy="75" rx="35" ry="25"/>
        <ellipse cx="185" cy="60" rx="40" ry="28"/>
      </g>
      <!-- Cloud edge waves -->
      <g stroke="#B49158" stroke-width="2" fill="none" stroke-linecap="round">
        <path d="M0,90 Q15,70 30,90 Q45,110 60,90 Q75,70 90,90 Q105,110 120,90"/>
        <path d="M0,75 Q15,55 30,75 Q45,95 60,75 Q75,55 90,75 Q105,95 120,75"/>
      </g>
    </pattern>
  </defs>
  <rect width="1200" height="120" fill="#FDF6E3"/>
  <rect width="1200" height="120" fill="url(#mega-divider-pattern)"/>
  <!-- Center ornamental accent -->
  <g transform="translate(600, 60)">
    <ellipse rx="30" ry="12" fill="none" stroke="#B49158" stroke-width="2"/>
    <ellipse rx="20" ry="8" fill="none" stroke="#B49158" stroke-width="1.5" stroke-dasharray="8,4"/>
    <circle r="4" fill="#B49158"/>
  </g>
</svg>