<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <pattern id="sidomukti-pattern" width="100" height="100" patternUnits="userSpaceOnUse">
      <!-- Sidomukti: prosperity motif - geometric prosperity symbols -->
      <g fill="none" stroke="#B49158" stroke-width="0.5" opacity="0.15">
        <!-- Main diamond grid -->
        <path d="M50,0 L100,50 L50,100 L0,50 Z"/>
        <path d="M150,0 L200,50 L150,100 L100,50 Z"/>
        <path d="M50,100 L100,150 L50,200 L0,150 Z"/>
        <path d="M150,100 L200,150 L150,200 L100,150 Z"/>
        
        <!-- Inner diamonds -->
        <path d="M50,25 L75,50 L50,75 L25,50 Z" stroke-width="0.3" opacity="0.1"/>
        <path d="M125,25 L150,50 L125,75 L100,50 Z" stroke-width="0.3" opacity="0.1"/>
        <path d="M50,125 L75,150 L50,175 L25,150 Z" stroke-width="0.3" opacity="0.1"/>
        <path d="M125,125 L150,150 L125,175 L100,150 Z" stroke-width="0.3" opacity="0.1"/>
        
        <!-- Dot matrix at intersections -->
        <circle cx="50" cy="50" r="1.5" fill="#B49158" opacity="0.3"/>
        <circle cx="150" cy="50" r="1.5" fill="#B49158" opacity="0.3"/>
        <circle cx="50" cy="150" r="1.5" fill="#B49158" opacity="0.3"/>
        <circle cx="150" cy="150" r="1.5" fill="#B49158" opacity="0.3"/>
        <circle cx="100" cy="100" r="1.5" fill="#B49158" opacity="0.3"/>
        <circle cx="0" cy="0" r="1.5" fill="#B49158" opacity="0.3"/>
        <circle cx="200" cy="0" r="1.5" fill="#B49158" opacity="0.3"/>
        <circle cx="0" cy="200" r="1.5" fill="#B49158" opacity="0.3"/>
        <circle cx="200" cy="200" r="1.5" fill="#B49158" opacity="0.3"/>
        <circle cx="100" cy="0" r="1.5" fill="#B49158" opacity="0.3"/>
        <circle cx="0" cy="100" r="1.5" fill="#B49158" opacity="0.3"/>
        <circle cx="200" cy="100" r="1.5" fill="#B49158" opacity="0.3"/>
        <circle cx="100" cy="200" r="1.5" fill="#B49158" opacity="0.3"/>
      </g>
    </pattern>
  </defs>
  <rect width="200" height="200" fill="#FDF6E3"/>
  <rect width="200" height="200" fill="url(#sidomukti-pattern)"/>
</svg>