<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 80 80">
  <defs>
    <pattern id="truntum-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <!-- Truntum: small star-like flowers (jasmine buds) symbolizing growing love -->
      <g fill="#B49158" opacity="0.6">
        <!-- Main star flower -->
        <polygon points="20,5 22,13 31,14 24,20 26,29 20,24 14,29 16,20 9,14 18,13" />
        <!-- Smaller buds around -->
        <polygon points="5,10 6,14 10,14 7,17 8,21 5,18 2,21 3,17 0,14 4,14" transform="scale(0.4)" fill="#C45A3C" opacity="0.5"/>
        <polygon points="5,10 6,14 10,14 7,17 8,21 5,18 2,21 3,17 0,14 4,14" transform="translate(30,25) scale(0.35)" fill="#D4B88A" opacity="0.5"/>
        <polygon points="5,10 6,14 10,14 7,17 8,21 5,18 2,21 3,17 0,14 4,14" transform="translate(35,5) scale(0.3)" fill="#B49158" opacity="0.4"/>
        <polygon points="5,10 6,14 10,14 7,17 8,21 5,18 2,21 3,17 0,14 4,14" transform="translate(5,30) scale(0.35)" fill="#C45A3C" opacity="0.4"/>
      </g>
      <!-- Center dots for each flower -->
      <circle cx="20" cy="20" r="2" fill="#8B2D2D" opacity="0.8"/>
      <circle cx="32" cy="30" r="1.5" fill="#8B2D2D" opacity="0.6" transform="scale(0.4)"/>
      <circle cx="37" cy="11" r="1.2" fill="#8B2D2D" opacity="0.6" transform="scale(0.3)"/>
      <circle cx="7" cy="32" r="1.5" fill="#8B2D2D" opacity="0.6" transform="scale(0.35)"/>
    </pattern>
  </defs>
  <rect width="80" height="80" fill="#FDF6E3"/>
  <rect width="80" height="80" fill="url(#truntum-pattern)"/>
</svg>