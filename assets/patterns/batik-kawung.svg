<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <defs>
    <pattern id="kawung-pattern" width="50" height="50" patternUnits="userSpaceOnUse">
      <!-- Kawung: four overlapping circles forming a clover/flower shape -->
      <circle cx="25" cy="25" r="20" fill="none" stroke="#B49158" stroke-width="1.5" opacity="0.6"/>
      <circle cx="25" cy="25" r="16" fill="none" stroke="#B49158" stroke-width="1" opacity="0.4"/>
      <circle cx="25" cy="25" r="10" fill="#B49158" opacity="0.3"/>
      <!-- Center dot -->
      <circle cx="25" cy="25" r="3" fill="#B49158"/>
    </pattern>
  </defs>
  <rect width="100" height="100" fill="#FDF6E3"/>
  <rect width="100" height="100" fill="url(#kawung-pattern)"/>
</svg>